name: lab3-etl

on:
  push:
    paths:
      - "лаб3/лаб3_dbt/**"
      - ".github/workflows/lab3_etl.yml"
  workflow_dispatch:

jobs:
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt
        run: python -m pip install dbt-duckdb
      - name: Create a tiny warehouse and run the mart
        working-directory: лаб3/лаб3_dbt
        run: |
          python seed_ci.py
          dbt run --project-dir . --profiles-dir .
