apiVersion: apps/v1
kind: Deployment
metadata:
  name: rec-ondemand
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rec
      pool: ondemand
  template:
    metadata:
      labels:
        app: rec
        pool: ondemand
    spec:
      containers:
        - name: rec
          image: rec-service:lab6
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - name: checkpoint
              mountPath: /data
      volumes:
        - name: checkpoint
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rec-spot
spec:
  replicas: 8
  selector:
    matchLabels:
      app: rec
      pool: spot
  template:
    metadata:
      labels:
        app: rec
        pool: spot
    spec:
      tolerations:
        - key: "cloud.google.com/gke-spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-pool
                    operator: In
                    values: ["spot"]
      containers:
        - name: rec
          image: rec-service:lab6
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - name: checkpoint
              mountPath: /data
      volumes:
        - name: checkpoint
          emptyDir: {}
