apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rec-spot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rec-spot
  minReplicas: 4
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
